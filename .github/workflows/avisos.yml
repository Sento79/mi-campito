name: Avisos GVA
on:
  schedule:
    - cron: "17 6,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/avisos_gva.py
      - name: Guardar si hay cambios
        run: |
          git config user.name "Mi Campito (avisos)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/avisos-gva.json
          git diff --cached --quiet || (git commit -m "Avisos GVA actualizados" && git push)
