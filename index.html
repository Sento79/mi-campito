<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Campito</title>
<meta name="description" content="App para llevar fincas de cítricos: riego, abonado, plagas y cosecha.">
<style>
:root{--bg:#f6f4ec;--tx:#1f2a1c;--mu:#5d6b57;--ac:#e07b16;--ca:#ffffff;--bd:#dcd8c8}
@media (prefers-color-scheme:dark){:root{--bg:#141a13;--tx:#eef0e8;--mu:#a9b3a2;--ac:#f39a3d;--ca:#1d251b;--bd:#2f3a2c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
main{max-width:520px;background:var(--ca);border:1px solid var(--bd);border-radius:18px;padding:28px 24px}
h1{margin:0 0 4px;font-size:30px}
h1 span{color:var(--ac)}
p{margin:12px 0;color:var(--mu)}
.est{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--bd);font-size:14px;color:var(--tx)}
</style>
</head>
<body>
<main>
<h1><span>●</span> Mi Campito</h1>
<p>La app para llevar tus fincas de naranjos, mandarinos, limoneros, pomelos y limas: riego, abonado, plagas, cosecha y gastos, según tu variedad y el clima de tu zona.</p>
<p>Tus datos se quedan en tu móvil.</p>
<span class="est">En construcción</span>
</main>
</body>
</html>
